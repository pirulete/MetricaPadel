version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: padel-evaluation-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel_dev_2026
      POSTGRES_DB: padel_evaluation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padel_evaluation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
